name: Sign IPA for your device

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out your fork
        uses: actions/checkout@v7.0.1

      - name: Check required secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          OUTPUT_PASSWORD: ${{ secrets.OUTPUT_PASSWORD }}
        run: |
          set -euo pipefail
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD \
              IOS_PROVISIONING_PROFILE_BASE64 OUTPUT_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required repository secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Download and verify the unsigned IPA
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output FilzaSlop-v1.0.0-unsigned.ipa \
            https://github.com/0xjohnnydev/FilzaSlop/releases/download/v1.0.0/FilzaSlop-v1.0.0-unsigned.ipa
          echo "0f7df472d18e4dd8eef521255562a1ff4a44c8e9e4035e29c9a72c2e9a2dbbd3  FilzaSlop-v1.0.0-unsigned.ipa" \
            | shasum -a 256 -c -

      - name: Decode your signing files
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$IOS_CERTIFICATE_BASE64" | /usr/bin/base64 -D > certificate.p12
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > profile.mobileprovision
          chmod 600 certificate.p12 profile.mobileprovision

      - name: Sign the IPA
        env:
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          scripts/sign_ipa.sh \
            FilzaSlop-v1.0.0-unsigned.ipa \
            certificate.p12 \
            profile.mobileprovision \
            FilzaSlop-v1.0.0-signed.ipa

      - name: Encrypt the signed IPA
        env:
          OUTPUT_PASSWORD: ${{ secrets.OUTPUT_PASSWORD }}
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in FilzaSlop-v1.0.0-signed.ipa \
            -out FilzaSlop-v1.0.0-signed.ipa.enc \
            -pass env:OUTPUT_PASSWORD
          shasum -a 256 FilzaSlop-v1.0.0-signed.ipa.enc

      - name: Upload the encrypted IPA
        uses: actions/upload-artifact@v7.0.1
        with:
          name: FilzaSlop-signed-encrypted
          path: FilzaSlop-v1.0.0-signed.ipa.enc
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Remove signing files from the runner
        if: always()
        run: |
          python3 - <<'PY'
          import os
          for path in (
              "certificate.p12",
              "profile.mobileprovision",
              "FilzaSlop-v1.0.0-signed.ipa",
          ):
              try:
                  os.unlink(path)
              except FileNotFoundError:
                  pass
          PY
